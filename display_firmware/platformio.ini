; PlatformIO Project Configuration - MediBot Sunton 7" Display Unit
; Target Hardware: Sunton ESP32-8048S070C (7.0" 800x480 RGB LCD + Goodix GT911 Capacitive Touch)
; Framework: ESP-IDF

[env:sunton_8048s070c]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_speed = 921600

board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_build.esp-idf.sdkconfig_defaults = sdkconfig.defaults sdkconfig.sunton_8048s070c
