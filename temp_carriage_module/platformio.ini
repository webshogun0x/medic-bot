; PlatformIO Project Configuration for MediBot Forehead Temperature Carriage Subsystem
; Target: ESP-12F / ESP-12E (ESP8266)
; Hardware:
;   - GY-906 (MLX90614) Non-contact IR Temperature Sensor (I2C: D1=SCL/GPIO5, D2=SDA/GPIO4)
;   - 20x4 Character LCD Display (I2C: D1=SCL/GPIO5, D2=SDA/GPIO4)
;   - TM1637 4-Digit 7-Segment LED Display (D5=CLK/GPIO14, D6=DIO/GPIO12)
;   - Forehead Proximity Ultrasonic Sensor (D8=Trig/GPIO15, D7=Echo/GPIO13)
;   - Master-Worker 2.4 GHz ESP-NOW

[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/Adafruit MLX90614 Library @ ^2.1.6
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    jasonacox/TM1637TinyDisplay @ ^1.1.0
    Wire

build_flags =
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
