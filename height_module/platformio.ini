; PlatformIO Project Configuration for MediBot Height Subsystem
; Target: ESP-WROOM-32 (ESP32 Dev Module)
; Hardware:
;   - VL53L0X Time-of-Flight Laser Sensor (I2C: SDA=21, SCL=22)
;   - 3x Patient Height Sonars (Pins: 12/13, 14/27, 26/25)
;   - 1x Gantry Carriage Tracker Sonar (Pins: 33/32)
;   - Master-Worker ESP-NOW 2.4 GHz

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/Adafruit_VL53L0X @ ^1.2.4
    pololu/VL53L0X @ ^1.3.1
    pololu/VL53L1X @ ^1.3.1
    adafruit/Adafruit BusIO @ ^1.16.1
    Wire
    WiFi

build_flags =
    -DCORE_DEBUG_LEVEL=3
