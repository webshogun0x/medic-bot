; PlatformIO Project Configuration for MediBot Vertical Stepper Gantry Subsystem
; Target: ESP-WROOM-32 (ESP32 Dev Module)
; Hardware:
;   - TB6600 Stepper Driver (PUL=GPIO18, DIR=GPIO19, ENA=GPIO21)
;   - Hardware Limit Switches (Bottom Home=GPIO4, Top Safety=GPIO5)
;   - NEMA Stepper Motor with Lead Screw
;   - Master-Worker 2.4 GHz ESP-NOW

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    waspinator/AccelStepper @ ^1.64
    WiFi

build_flags =
    -DCORE_DEBUG_LEVEL=3
