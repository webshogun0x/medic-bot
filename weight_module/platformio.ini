; PlatformIO Project Configuration for MediBot Weight Scale Subsystem
; Target: ESP-12F / ESP-12E (ESP8266)
; Hardware:
;   - 4x Strain Gauge Load Cells (Wheatstone Bridge)
;   - HX711 24-bit ADC Amplifier (DOUT=GPIO4/D2, SCK=GPIO5/D1)
;   - Master-Worker 2.4 GHz ESP-NOW

[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bogde/HX711 @ ^0.7.5

build_flags =
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY

build_src_filter = +<main.cpp>

; =========================================================================
; Standalone Pure Raw ADC Hardware Test (Wi-Fi Radio Completely Disabled)
; =========================================================================
[env:raw_adc_test]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bogde/HX711 @ ^0.7.5

build_flags =
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY

build_src_filter = +<test_raw_adc.cpp>

; =========================================================================
; Quiet Sampling Test (Orchestrated + Autonomous with Zero Radio during ADC)
; =========================================================================
[env:quiet_weight_test]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bogde/HX711 @ ^0.7.5

build_flags =
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY

build_src_filter = +<quiet_weight_node.cpp>
